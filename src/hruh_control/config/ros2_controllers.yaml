# ros2_control controllers for HRUH (used by gz_ros2_control and by the mock
# hardware in hruh_moveit_config/launch/demo.launch.py).
#
# This file deliberately lives outside my_robot_description: ros2_control 4.x
# drops every controller-manager argument containing "robot_description" when
# it builds the controller nodes, so a params-file path under
# .../my_robot_description/... loses its path and every controller fails with
# "Couldn't parse params file: '--params-file -p'".
controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    legs_controller:
      type: position_controllers/JointGroupPositionController
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# gz_ros2_control turns position commands into joint velocity targets:
# v = gain * (q_cmd - q).  The default (0.1 /s) is far too soft for a
# walking robot; this tracks a 20 Hz gait with a few ms of lag.
gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 60.0

# Streamed at 100 Hz by hruh_walker (order matters).
legs_controller:
  ros__parameters:
    joints:
      - left_hip_yaw_joint
      - left_hip_roll_joint
      - left_hip_pitch_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - left_toe_joint
      - right_hip_yaw_joint
      - right_hip_roll_joint
      - right_hip_pitch_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - right_toe_joint

# (no waist: the torso is rigid)

head_controller:
  ros__parameters:
    joints:
      - chest_to_neck
      - neck_to_head
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

left_arm_controller:
  ros__parameters:
    joints:
      - chest_to_left_shoulder
      - left_shoulder_to_bisecp
      - left_bisecp_to_elbow_inword
      - left_elbow_inword_to_midle
      - left_forarm_to_wrist
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

right_arm_controller:
  ros__parameters:
    joints:
      - chest_to_right_shoulder
      - right_shoulder_to_bisecp
      - right_bisecp_to_elbow_inword
      - right_elbow_inword_to_midle
      - right_forarm_to_wrist
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

left_hand_controller:
  ros__parameters:
    joints:
      - left_palm_to_thomb
      - left_thomb_to_thomb_middle
      - left_thomb_middle_to_thomb_upper
      - left_palm_to_finger1_lower
      - left_palm_to_finger2_lower
      - left_palm_to_finger3_lower
      - left_palm_to_finger4_lower
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

right_hand_controller:
  ros__parameters:
